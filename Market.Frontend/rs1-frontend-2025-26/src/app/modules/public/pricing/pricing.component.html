<div class="pricing-page">

  <div class="shader-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="page-inner">

    <div class="page-header">
      <h1><span class="gradient-text">Cjenovnik</span></h1>
      <p>Naša ponuda pića, hrane i usluga</p>
    </div>

    <div class="loading" *ngIf="isLoading">
      <div class="spinner"></div>
      Učitavanje cjenovnika...
    </div>

    <div *ngIf="!isLoading && groups.length > 0">

      <!-- Category tabs -->
      <div class="cat-tabs">
        <button
          class="cat-tab"
          *ngFor="let g of groups"
          [class.active]="activeCategory === g.category.id"
          (click)="activeCategory = g.category.id"
        >
          <mat-icon>{{ categoryIcon(g.category.name) }}</mat-icon>
          {{ g.category.name }}
        </button>
      </div>

      <!-- Items — unified list layout for all categories -->
      <div class="menu-list" *ngIf="activeGroup">
        <div
          class="menu-item"
          [class]="'accent-' + categoryAccent(activeGroup.category.name)"
          *ngFor="let item of activeGroup.items"
        >
          <div class="menu-icon">
            <mat-icon>{{ categoryIcon(activeGroup.category.name) }}</mat-icon>
          </div>
          <div class="menu-body">
            <h3 class="item-name">{{ item.name }}</h3>
            <p class="item-desc" *ngIf="item.description">{{ item.description }}</p>
          </div>
          <div class="menu-price">{{ formatPrice(item.price) }}</div>
        </div>
      </div>

    </div>

    <div class="empty" *ngIf="!isLoading && groups.length === 0">
      <mat-icon>menu_book</mat-icon>
      <p>Cjenovnik trenutno nije dostupan</p>
    </div>

  </div>
</div>
