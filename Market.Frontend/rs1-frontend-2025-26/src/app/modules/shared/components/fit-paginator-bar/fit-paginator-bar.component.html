<div class="paginator-bar" *ngIf="vm.totalItems > 0">
  <div class="paginator-container">

    <!-- Stats -->
    <div class="page-stats">
      <span class="stat-pages">
        <span class="stat-current">{{ vm.request.paging.page }}</span>
        <span class="stat-sep">/</span>
        <span class="stat-total-pages">{{ vm.totalPages || 1 }}</span>
      </span>
      <span class="stat-dot"></span>
      <span class="stat-records">{{ vm.totalItems }} zapisa</span>
    </div>

    <!-- Controls -->
    <div class="paginator-controls">

      <!-- Per page -->
      <div class="per-page">
        <span class="per-page-label">po stranici</span>
        <select
          class="size-select"
          (change)="vm.changePageSize(+$any($event.target).value)"
          [disabled]="vm.isLoading"
        >
          <option [value]="5"  [selected]="vm.request.paging.pageSize === 5">5</option>
          <option [value]="10" [selected]="vm.request.paging.pageSize === 10">10</option>
          <option [value]="20" [selected]="vm.request.paging.pageSize === 20">20</option>
          <option [value]="50" [selected]="vm.request.paging.pageSize === 50">50</option>
        </select>
      </div>

      <!-- Navigation -->
      <div class="nav-group">
        <button
          class="nav-btn"
          (click)="vm.prevPage()"
          [disabled]="vm.request.paging.page <= 1 || vm.isLoading"
          title="Prethodna stranica"
        >
          <mat-icon>west</mat-icon>
        </button>

        <div class="page-pill">{{ vm.request.paging.page }}</div>

        <button
          class="nav-btn"
          (click)="vm.nextPage()"
          [disabled]="(vm.totalPages && vm.request.paging.page >= vm.totalPages) || vm.isLoading"
          title="Sljedeća stranica"
        >
          <mat-icon>east</mat-icon>
        </button>
      </div>

    </div>
  </div>
</div>
