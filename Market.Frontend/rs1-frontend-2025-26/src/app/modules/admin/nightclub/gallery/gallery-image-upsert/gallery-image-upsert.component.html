<h2 mat-dialog-title>
  {{ isEdit ? 'Uredi sliku' : 'Dodaj sliku u galeriju' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="onSave()">

    <!-- Error -->
    <div class="error-banner" *ngIf="errorMessage">
      <mat-icon>error_outline</mat-icon>
      {{ errorMessage }}
    </div>

    <!-- Image -->
    <app-image-picker formControlName="imageUrl" label="Slika galerije" />

    <!-- Caption -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Opis (opcionalno)</mat-label>
      <input matInput formControlName="caption" placeholder="Kratak opis slike..." />
      <mat-icon matSuffix>comment</mat-icon>
      <mat-hint align="end">{{ (form.get('caption')?.value?.length ?? 0) }}/200</mat-hint>
      <mat-error *ngIf="form.get('caption')?.hasError('maxlength')">Maks. 200 znakova</mat-error>
    </mat-form-field>

    <!-- Display order -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Redoslijed prikaza</mat-label>
      <input matInput type="number" formControlName="displayOrder" min="1" />
      <mat-icon matSuffix>sort</mat-icon>
      <mat-error *ngIf="form.get('displayOrder')?.hasError('required')">Redoslijed je obavezan</mat-error>
      <mat-error *ngIf="form.get('displayOrder')?.hasError('min')">Mora biti ≥ 1</mat-error>
    </mat-form-field>

    <!-- Is enabled (only for edit) -->
    <div class="enabled-field" *ngIf="isEdit">
      <mat-checkbox formControlName="isEnabled" class="checkbox-enabled">
        Aktivna slika
      </mat-checkbox>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button (click)="onCancel()" [disabled]="isSubmitting">
    <mat-icon>close</mat-icon>
    Otkaži
  </button>
  <button mat-raised-button (click)="onSave()" [disabled]="isSubmitting || form.invalid">
    <mat-spinner *ngIf="isSubmitting" diameter="18" />
    <mat-icon *ngIf="!isSubmitting">{{ isEdit ? 'save' : 'add_photo_alternate' }}</mat-icon>
    {{ isEdit ? 'Spremi' : 'Dodaj' }}
  </button>
</mat-dialog-actions>
