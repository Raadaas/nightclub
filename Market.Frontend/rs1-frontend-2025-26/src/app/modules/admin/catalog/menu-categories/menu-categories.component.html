<div class="container">

  <!-- Shader pozadina -->
  <div class="shader-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Header kartica -->
  <div class="header-card mat-elevation-z2">
    <div class="header-card-content">
      <!-- Lijevo: naslov -->
      <h1>Kategorije menija</h1>

      <!-- Desno: filter + novi -->
      <div class="actions-container">
        <mat-slide-toggle
          [(ngModel)]="showOnlyEnabled"
          (change)="onToggleEnabledFilter($event.checked)"
          class="enabled-toggle"
        >
          Samo aktivne
        </mat-slide-toggle>

        <button mat-raised-button color="primary" (click)="onCreate()">
          <mat-icon>add</mat-icon>
          Nova kategorija
        </button>
      </div>
    </div>
  </div>

  <!-- Loading / error -->
  <div *ngIf="isLoading" class="loading">
    Učitavanje...
  </div>

  <div *ngIf="!isLoading && errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <!-- Tabela -->
  <div class="mat-elevation-z8" *ngIf="!isLoading && !errorMessage">
    <table mat-table [dataSource]="items">

      <!-- Naziv -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Naziv</th>
        <td mat-cell *matCellDef="let category">
          <span style="font-weight: 500">{{ category.name }}</span>
        </td>
      </ng-container>

      <!-- Redoslijed prikaza -->
      <ng-container matColumnDef="displayOrder">
        <th mat-header-cell *matHeaderCellDef>Redoslijed</th>
        <td mat-cell *matCellDef="let category">
          {{ category.displayOrder }}
        </td>
      </ng-container>

      <!-- Aktivno -->
      <ng-container matColumnDef="isEnabled">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let category">
          <mat-icon [ngClass]="category.isEnabled ? 'icon-enabled' : 'icon-disabled'">
            {{ category.isEnabled ? 'check_circle' : 'cancel' }}
          </mat-icon>
        </td>
      </ng-container>

      <!-- Akcije -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Akcije</th>
        <td mat-cell *matCellDef="let category">
          <button
            mat-icon-button
            color="primary"
            (click)="onEdit(category)"
            matTooltip="Uredi kategoriju"
          >
            <mat-icon>edit_note</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            (click)="onDelete(category)"
            matTooltip="Obriši kategoriju"
          >
            <mat-icon>delete_forever</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <!-- No data -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">
          Nema podataka za prikaz.
        </td>
      </tr>
    </table>

    <app-fit-paginator-bar [vm]="this" />
  </div>
</div>
