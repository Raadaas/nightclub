<div class="logout-wrapper" @fadeInUp>

  <!-- Shader background (same blobs as login) -->
  <div class="logout-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="logout-card">

    <!-- Animated icon -->
    <div class="icon-ring">
      <div class="ring ring-outer"></div>
      <div class="ring ring-inner"></div>
      <mat-icon class="power-icon">power_settings_new</mat-icon>
    </div>

    <h2 class="logout-title">{{ 'AUTH.LOGOUT.TITLE' | translate }}</h2>
    <p class="logout-message">{{ 'AUTH.LOGOUT.MESSAGE' | translate }}</p>

    <!-- Progress & countdown -->
    <div class="logout-progress">
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div class="countdown">
        <mat-icon>schedule</mat-icon>
        <span>{{ 'AUTH.LOGOUT.REDIRECT_IN' | translate : { seconds: countdownSeconds } }}</span>
      </div>
    </div>

  </div>
</div>
